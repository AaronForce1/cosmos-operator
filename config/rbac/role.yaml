---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tempo.aaronforce.io
  resources:
  - tempofullnodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tempo.aaronforce.io
  resources:
  - tempofullnodes/finalizers
  verbs:
  - update
- apiGroups:
  - tempo.aaronforce.io
  resources:
  - tempofullnodes/status
  verbs:
  - get
  - patch
  - update
